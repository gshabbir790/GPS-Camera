name: gps_camera
description: "GPS کیمرہ - تصویر پر لوکیشن، تاریخ اور وقت کا اسٹیمپ"
publish_to: 'none'
version: 2.7.9+279

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  sensors_plus: ^6.1.1
  image: ^4.3.0
  gal: ^2.3.0
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  shared_preferences: ^2.3.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  pdf: ^3.11.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
  fonts:
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf

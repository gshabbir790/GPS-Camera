name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build one universal Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.hassan --project-name gps_camera --no-pub /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android ./android
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Force Android compileSdk 36 for all modules
        run: |
          cat >> android/build.gradle <<'EOF'

          subprojects {
              afterEvaluate { project ->
                  def androidExtension = project.extensions.findByName("android")
                  if (androidExtension != null) {
                      androidExtension.compileSdkVersion(36)
                  }
              }
          }
          EOF

      - name: Configure consistent debug signing
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Verify Dart source
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Build a single universal APK
        run: |
          set -o pipefail
          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64 \
            --obfuscate --split-debug-info=build/symbols 2>&1 | tee build.log

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/GPS-Camera-Universal.apk
          ls -lh artifacts/GPS-Camera-Universal.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Camera-Universal-APK
          path: artifacts/GPS-Camera-Universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Camera-Build-Logs
          path: |
            analyze.log
            build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/GPS-Camera-Universal.apk

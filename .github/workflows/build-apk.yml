name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android فولڈر خودکار بنائیں (تازہ ترین Flutter کے مطابق)
        run: |
          flutter create --platforms=android --org com.hassan --project-name gps_camera --no-pub /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android ./android
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: ہر بار ایک ہی سائننگ کی (تاکہ نیا APK پرانی ایپ کے اوپر انسٹال ہو سکے)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: آئیکن بنائیں
        run: dart run flutter_launcher_icons

      - name: APK بنائیں (چھوٹا سائز - ہر پروسیسر کے لیے الگ)
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64,android-arm \
            --obfuscate --split-debug-info=build/symbols

      - name: APK فائلوں کے نام درست کریں
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do mv "$f" "GPS-Camera-${f#app-}"; done
          ls -lh *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GPS-Camera-APK
          path: build/app/outputs/flutter-apk/*.apk

      - name: Release پر بھی ڈال دیں (جب tag v1.0.0 جیسا ہو)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk


name: Build GPS Camera Universal APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/cleanup-queue.yml'
  workflow_dispatch:

# نئی push آنے پر پرانی چلتی/قطار والی runs خود بخود cancel ہو جائیں
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Download repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Java setup
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Flutter setup
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Generate fresh Android project
      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          flutter create \
            --platforms=android \
            --org com.gsabbir \
            --project-name gps_camera \
            --no-pub \
            /tmp/gps-camera-scaffold

          rm -rf android
          cp -R /tmp/gps-camera-scaffold/android ./android

          mkdir -p android/app/src/main

          cp android_overrides/AndroidManifest.xml \
            android/app/src/main/AndroidManifest.xml

          # Volume button + Downloads save support (native MainActivity)
          MAIN_KT="$(find android/app/src/main -name MainActivity.kt | head -n 1)"
          test -n "$MAIN_KT"
          PKG="$(grep -m1 '^package ' "$MAIN_KT" | sed 's/^package //' | tr -d '\r ')"
          test -n "$PKG"
          sed "s/__PKG__/${PKG}/" android_overrides/MainActivity.kt.tpl > "$MAIN_KT"
          APP_KT="$(dirname "$MAIN_KT")/App.kt"
          sed "s/__PKG__/${PKG}/" android_overrides/App.kt.tpl > "$APP_KT"

          # Video stamp (Media3 Transformer) dependencies
          if [ -f android/app/build.gradle.kts ]; then
            {
              echo ''
              echo 'dependencies {'
              echo '    implementation("androidx.media3:media3-transformer:1.4.1")'
              echo '    implementation("androidx.media3:media3-effect:1.4.1")'
              echo '    implementation("androidx.media3:media3-common:1.4.1")'
              echo '}'
            } >> android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            {
              echo ''
              echo 'dependencies {'
              echo "    implementation 'androidx.media3:media3-transformer:1.4.1'"
              echo "    implementation 'androidx.media3:media3-effect:1.4.1'"
              echo "    implementation 'androidx.media3:media3-common:1.4.1'"
              echo '}'
            } >> android/app/build.gradle
          else
            echo "ERROR: android/app/build.gradle(.kts) not found"
            exit 1
          fi

          # R8 fix: WorkManager (comes with Google Mobile Ads) crashed at app start
          # ("Failed to create an instance of androidx.work.impl.WorkDatabase")
          {
            echo ''
            echo 'android.r8.strictFullModeForKeepRules=false'
          } >> android/gradle.properties
          {
            echo '-keep class androidx.work.** { *; }'
            echo '-keep class androidx.startup.** { *; }'
            echo '-keep class * extends androidx.room.RoomDatabase { *; }'
            echo '-keepclassmembers class * extends androidx.room.RoomDatabase { <init>(...); }'
            echo '-dontwarn androidx.work.**'
          } > android/app/extra-proguard-rules.pro
          if [ -f android/app/build.gradle.kts ]; then
            {
              echo ''
              echo 'android {'
              echo '    buildTypes {'
              echo '        getByName("release") {'
              echo '            proguardFiles("extra-proguard-rules.pro")'
              echo '        }'
              echo '    }'
              echo '}'
            } >> android/app/build.gradle.kts
          else
            {
              echo ''
              echo 'android {'
              echo '    buildTypes {'
              echo '        release {'
              echo "            proguardFiles 'extra-proguard-rules.pro'"
              echo '        }'
              echo '    }'
              echo '}'
            } >> android/app/build.gradle
          fi

      # 5. Install Android SDK 36
      - name: Install Android SDK Platform 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" \
              -name sdkmanager -type f | head -n 1)"
          fi

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" "platforms;android-36"

      # 6. Keep signing key consistent
      - name: Configure signing key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          test -f ci/debug.keystore

          cp ci/debug.keystore \
            "$HOME/.android/debug.keystore"

      # 7. Download Flutter packages
      - name: Get Flutter dependencies
        run: flutter pub get

      # 8. FIX: geocoding_android compileSdk 33 -> 36
      - name: Fix Android compileSdk 36
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          pub_cache = (
              Path.home()
              / ".pub-cache"
              / "hosted"
              / "pub.dev"
          )

          plugin_dirs = list(
              pub_cache.glob("geocoding_android-*")
          )

          if not plugin_dirs:
              sys.exit(
                  "ERROR: geocoding_android package not found."
              )

          updated_files = []

          patterns = [
              re.compile(
                  r"(?m)^(\s*compileSdkVersion\s+)"
                  r"([^\s]+)(.*)$"
              ),
              re.compile(
                  r"(?m)^(\s*compileSdkVersion\s*=\s*)"
                  r"([^\s]+)(.*)$"
              ),
              re.compile(
                  r"(?m)^(\s*compileSdk\s*=\s*)"
                  r"([^\s]+)(.*)$"
              ),
              re.compile(
                  r"(?m)^(\s*compileSdk\s+)"
                  r"([^\s]+)(.*)$"
              ),
          ]

          for plugin_dir in plugin_dirs:
              android_dir = plugin_dir / "android"

              for gradle_file in android_dir.glob("build.gradle*"):
                  original = gradle_file.read_text(
                      encoding="utf-8"
                  )

                  updated = original

                  for pattern in patterns:
                      updated = pattern.sub(
                          lambda match:
                              match.group(1) + "36" + match.group(3),
                          updated
                      )

                  if updated != original:
                      gradle_file.write_text(
                          updated,
                          encoding="utf-8"
                      )
                      updated_files.append(gradle_file)

          # پہلے سے 36 ہو (cache کی وجہ سے) تو بھی ٹھیک ہے
          all_lines = []
          for plugin_dir in plugin_dirs:
              for gradle_file in (
                  plugin_dir / "android"
              ).glob("build.gradle*"):
                  for line in gradle_file.read_text(
                      encoding="utf-8"
                  ).splitlines():
                      if re.match(r"\s*compileSdk", line):
                          all_lines.append(line.strip())

          if not all_lines:
              sys.exit(
                  "ERROR: No compileSdk line found in "
                  "geocoding_android Gradle files."
              )

          bad = [l for l in all_lines if "36" not in l]
          if bad:
              sys.exit(
                  "ERROR: compileSdk is not 36: " + str(bad)
              )

          print("Successfully updated:")
          for path in updated_files:
              print(f"  {path}")

          print("\nVerification:")
          for plugin_dir in plugin_dirs:
              for gradle_file in (
                  plugin_dir / "android"
              ).glob("build.gradle*"):
                  for line in gradle_file.read_text(
                      encoding="utf-8"
                  ).splitlines():
                      if "compileSdk" in line:
                          print(line.strip())

          PY

      # 9. Verify Android configuration
      - name: Verify Android SDK configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Installed Android platforms:"
          ls -1 "$ANDROID_HOME/platforms"

          echo "geocoding_android compileSdk:"
          grep -nE 'compileSdk(Version)?' \
            "$HOME"/.pub-cache/hosted/pub.dev/geocoding_android-*/android/build.gradle*

      # 10. Dart analysis (diagnostic only)
      - name: Analyze Dart code
        shell: bash
        run: |
          set +e

          flutter analyze --no-pub \
            --no-fatal-infos \
            --no-fatal-warnings \
            2>&1 | tee analyze.log

          exit 0

      # 11. Generate launcher icon
      - name: Generate app icon
        run: dart run flutter_launcher_icons

      # 12. Build ONE universal APK
      - name: Disable Android lint-vital (lint tool crashes on JDK 17 with newer plugins)
        run: |
          mkdir -p ~/.gradle/init.d
          {
            echo 'allprojects {'
            echo '  tasks.configureEach { t ->'
            echo '    if (t.name.startsWith("lintVital") || t.name.startsWith("lintAnalyze")) {'
            echo '      t.enabled = false'
            echo '    }'
            echo '  }'
            echo '}'
          } > ~/.gradle/init.d/no-lint.gradle
          cat ~/.gradle/init.d/no-lint.gradle

      - name: Build Universal APK
        shell: bash
        run: |
          set -o pipefail

          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64 \
            --obfuscate \
            --split-debug-info=build/symbols \
            2>&1 | tee build.log

      # 13. Rename APK
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp build/app/outputs/flutter-apk/app-release.apk \
            artifacts/GPS-Camera-Universal.apk

          echo "APK successfully generated:"
          ls -lh artifacts/GPS-Camera-Universal.apk

      # 14. Upload APK
      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Camera-Universal-APK
          path: artifacts/GPS-Camera-Universal.apk
          if-no-files-found: error
          retention-days: 30

      # 15. Upload logs if build fails
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Camera-Build-Logs
          path: |
            build.log
            analyze.log
          if-no-files-found: ignore
          retention-days: 7

      # 16. Publish GitHub release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/GPS-Camera-Universal.apk
